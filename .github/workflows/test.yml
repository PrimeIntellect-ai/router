name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test

      # Lints run on a pinned stable toolchain (same pin as upstream's
      # Buildkite) so new nightly lints can't break CI.
      - name: Install Rust 1.95.0 for lints
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Clippy
        run: cargo +1.95.0 clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo +1.95.0 fmt --check
